<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Observer Wi-Fi Setup</title>
<style>
  :root { --bg:#0b1020; --card:#151b2e; --line:#26304a; --text:#e8ecf4; --muted:#8a94a8; --acc:#ffc93c; --ok:#3ddc84; --err:#ff5a4e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:440px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0f1424; color:var(--text); font-size:16px; }
  button { width:100%; padding:13px; border:0; border-radius:10px; background:var(--acc); color:#1b1400; font-weight:700; font-size:16px; margin-top:16px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:500; margin-top:8px; padding:9px; font-size:14px; }
  ul { list-style:none; margin:0; padding:0; max-height:280px; overflow:auto; }
  li { display:flex; justify-content:space-between; align-items:center; padding:11px 8px; border-bottom:1px solid var(--line); cursor:pointer; border-radius:8px; }
  li:hover, li.sel { background:#1d2540; }
  .rssi { color:var(--muted); font-size:13px; white-space:nowrap; }
  .msg { margin-top:12px; font-size:14px; min-height:20px; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--err); }
  .row { display:flex; gap:8px; align-items:center; }
  .row input[type=checkbox] { width:auto; }
  .muted-s { color:var(--muted); font-size:13px; margin:4px 0 8px; }
  li .del { width:auto; margin:0; padding:5px 10px; font-size:13px; background:transparent; color:var(--err); border:1px solid var(--line); font-weight:500; }
  li.saved { cursor:default; }
</style>
</head>
<body>
<main>
  <h1>Agent Observer</h1>
  <p class="sub">Connect the device to your Wi-Fi network.</p>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <strong>Networks</strong>
    </div>
    <ul id="list"><li style="cursor:default;color:var(--muted)">Scanning...</li></ul>
    <button class="ghost" id="rescan" type="button">Scan again</button>
  </div>

  <div class="card" id="saved-card" hidden>
    <strong>Saved networks</strong>
    <div class="muted-s">The device connects to the preferred one when in range, otherwise to the strongest.</div>
    <ul id="saved"></ul>
    <button class="ghost" id="restart" type="button">Done - restart and connect</button>
  </div>

  <form class="card" id="form">
    <label for="ssid">Network name (SSID)</label>
    <input id="ssid" maxlength="32" required autocomplete="off" autocapitalize="none">
    <label for="pw">Password</label>
    <input id="pw" type="password" maxlength="63" autocomplete="off">
    <div class="row" style="margin-top:8px"><input type="checkbox" id="show"><label for="show" style="margin:0">Show password</label></div>
    <div class="row" style="margin-top:8px"><input type="checkbox" id="pref"><label for="pref" style="margin:0">Preferred network</label></div>
    <button type="submit">Save &amp; connect</button>
    <div class="msg" id="msg"></div>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
function bars(rssi) { return rssi > -55 ? '▂▄▆█' : rssi > -67 ? '▂▄▆' : rssi > -78 ? '▂▄' : '▂'; }
async function scan(refresh) {
  $('list').innerHTML = '<li style="cursor:default;color:var(--muted)">Scanning...</li>';
  try {
    const r = await fetch('/api/scan' + (refresh ? '?refresh=1' : ''));
    const nets = await r.json();
    const ul = $('list');
    ul.innerHTML = '';
    if (!nets.length) ul.innerHTML = '<li style="cursor:default;color:var(--muted)">No networks found</li>';
    nets.forEach(n => {
      const li = document.createElement('li');
      const name = document.createElement('span');
      name.textContent = (n.secure ? '🔒 ' : '') + n.ssid;
      const s = document.createElement('span');
      s.className = 'rssi';
      s.textContent = bars(n.rssi) + ' ' + n.rssi + ' dBm';
      li.append(name, s);
      li.onclick = () => {
        document.querySelectorAll('li').forEach(x => x.classList.remove('sel'));
        li.classList.add('sel');
        $('ssid').value = n.ssid;
        $('pw').value = '';
        if (n.secure) $('pw').focus();
      };
      ul.append(li);
    });
  } catch (e) {
    $('list').innerHTML = '<li style="cursor:default;color:var(--err)">Scan failed</li>';
  }
}
$('rescan').onclick = () => scan(true);
$('show').onchange = (e) => { $('pw').type = e.target.checked ? 'text' : 'password'; };
$('form').onsubmit = async (e) => {
  e.preventDefault();
  const msg = $('msg');
  msg.className = 'msg'; msg.textContent = 'Saving...';
  try {
    const r = await fetch('/api/wifi', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ ssid: $('ssid').value, password: $('pw').value, preferred: $('pref').checked }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'failed');
    msg.className = 'msg ok';
    msg.textContent = 'Saved. The device is restarting and will connect to "' + $('ssid').value +
      '". Reconnect this phone/PC to that network, then open http://<name>.local (agent-observer.local unless renamed) or the IP shown on the display.';
  } catch (err) {
    msg.className = 'msg err'; msg.textContent = 'Error: ' + err.message;
  }
};
async function loadSaved() {
  try {
    const j = await (await fetch('/api/wifi/networks')).json();
    const ul = $('saved');
    ul.innerHTML = '';
    $('saved-card').hidden = !j.networks.length;
    j.networks.forEach(n => {
      const li = document.createElement('li');
      li.className = 'saved';
      const name = document.createElement('span');
      name.textContent = (n.preferred ? '★ ' : '') + n.ssid;
      const del = document.createElement('button');
      del.className = 'del'; del.type = 'button'; del.textContent = 'Delete';
      del.onclick = async () => {
        if (!confirm('Forget "' + n.ssid + '"?')) return;
        await fetch('/api/wifi/networks/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ssid: n.ssid }) });
        loadSaved();
      };
      li.append(name, del);
      ul.append(li);
    });
  } catch (e) {}
}
$('restart').onclick = async () => {
  try { await fetch('/api/restart', { method:'POST' }); $('restart').textContent = 'Restarting...'; } catch (e) {}
};
scan(false);
loadSaved();
</script>
</body>
</html>
