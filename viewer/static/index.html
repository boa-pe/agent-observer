<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Observer</title>
<style>
  :root {
    --bg0: #0b1020; --bg1: #171d33; --text: #e8ecf4; --muted: #7a8496;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(180deg, var(--bg0), var(--bg1));
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 20px 24px 8px;
  }
  header h1 { margin: 0; font-size: 1.25rem; font-weight: 650; }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px; padding: 12px 24px 40px;
    justify-items: center;
  }
  .empty {
    grid-column: 1 / -1; color: var(--muted); padding: 48px 8px; text-align: center;
  }
  .card canvas {
    width: 172px; height: 320px;
    border-radius: 4px;
    image-rendering: pixelated;
    background: #0b1020;
    box-shadow: 0 0 0 1px rgba(255,255,255,.06);
    display: block;
  }
</style>
</head>
<body>
<header>
  <h1>Agent Observer</h1>
</header>
<div id="grid"><div class="empty">No agents yet. Point the usual device hooks at http://127.0.0.1:8770.</div></div>
<script src="/static/robot.js"></script>
<script>
let agents = [];
let lastJson = '';
const cards = new Map(); // id -> {el, canvas, agent}

function ensureCard(a) {
  let rec = cards.get(a.id);
  if (rec) {
    rec.agent = a;
    return rec;
  }
  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML = `<canvas width="172" height="320"></canvas>`;
  rec = { el, canvas: el.querySelector('canvas'), agent: a };
  cards.set(a.id, rec);
  return rec;
}

async function poll() {
  const grid = document.getElementById('grid');
  try {
    const r = await fetch('/api/agents', { cache: 'no-store' });
    const data = await r.json();
    const list = data.agents || [];
    const dump = JSON.stringify(list);
    if (dump === lastJson) return;
    lastJson = dump;
    agents = list;
    for (const a of list) {
      const rec = cards.get(a.id);
      if (rec) rec.agent = a;
    }

    if (!agents.length) {
      cards.clear();
      grid.innerHTML = '<div class="empty">No agents yet. Point the usual device hooks at http://127.0.0.1:8770.</div>';
      return;
    }

    const keep = new Set(agents.map(a => a.id));
    for (const key of [...cards.keys()]) {
      if (!keep.has(key)) cards.delete(key);
    }
    grid.replaceChildren(...agents.map(a => ensureCard(a).el));
  } catch (e) {
    lastJson = '';
    agents = [];
    cards.clear();
    grid.innerHTML = '<div class="empty">Cannot reach the local viewer server.</div>';
  }
}

function frame(now) {
  const t = now | 0;
  for (const rec of cards.values()) {
    AgentRobot.paintCard(rec.canvas, rec.agent, t);
  }
  requestAnimationFrame(frame);
}

poll();
setInterval(poll, 1000);
requestAnimationFrame(frame);
</script>
</body>
</html>
